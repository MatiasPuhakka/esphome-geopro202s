# The Node's config for a local build: the settings in node.yaml, with the
# geopro_202s Component from this checkout.
# The API key and OTA password come from secrets.yaml next to this file (gitignored).
# The Home Assistant add-on builds addon/geopro-202s.yaml instead, which takes both
# from main on GitHub.

packages:
  node: !include node.yaml

external_components:
  - source:
      type: local
      path: components
    components: [geopro_202s]
