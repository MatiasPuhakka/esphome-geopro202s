name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check-secrets
      - run: make check-manual-links
      - run: make test
      - run: make tools-test

  # Whether the esphome job has anything to check. A pull request that changes only the
  # tools, docs, manuals or Markdown files can't change what ESPHome validates or compiles,
  # so the job skips it. Pushes to main always run it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.diff.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's merge commit and its first parent, the base branch.
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo firmware=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          other=$(git diff --name-only HEAD^1 HEAD -- . ':!tools/' ':!docs/' ':!manuals/' ':!*.md')
          printf 'Files the esphome job checks:\n%s\n' "${other:-(none)}"
          if [ -n "$other" ]; then echo firmware=true; else echo firmware=false; fi >> "$GITHUB_OUTPUT"

  esphome:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The version the owner's Home Assistant add-on builds their Node with. When
        # the add-on moves to a new series, bump this and SUPPORTED_ESPHOME in the
        # Makefile in the same change (docs/adr/0002).
        esphome: ["2026.9.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: pip install esphome==${{ matrix.esphome }}
      # ESPHome downloads the ESP-IDF framework and toolchains into ~/.cache/esphome on
      # the first compile, with a venv built from this job's Python. They change only
      # with the ESPHome version and that Python, which the key names, so a saved key
      # never needs saving again.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-idf-${{ matrix.esphome }}-${{ runner.os }}-python-${{ steps.python.outputs.python-version }}
      # The build directories, so a compile only rebuilds what changed. A new key saves
      # them whenever a config or the Component changes.
      - uses: actions/cache@v4
        with:
          path: tests/.esphome
          key: esphome-build-${{ matrix.esphome }}-${{ hashFiles('tests/*.yaml', 'components/**') }}
          restore-keys: esphome-build-${{ matrix.esphome }}-
      - run: make check-config
      - run: make check-contract
      - run: make compile
