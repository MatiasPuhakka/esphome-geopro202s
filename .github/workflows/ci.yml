name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check-secrets
      - run: make test

  esphome:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The version the component was developed against, and the version the
        # Home Assistant add-on builds the Node with. Bump deliberately.
        esphome: ["2025.2.2", "2026.9.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome==${{ matrix.esphome }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            tests/.esphome
          key: esphome-${{ matrix.esphome }}-${{ hashFiles('tests/*.yaml') }}
          restore-keys: esphome-${{ matrix.esphome }}-
      - run: make check-config
      # geopro.yaml uses the Ethernet clk: block, which 2025.2.2 doesn't know.
      - if: matrix.esphome != '2025.2.2'
        run: |
          printf 'api_encryption_key: "%s"\nota_password: ci\n' "$(head -c 32 /dev/urandom | base64)" > secrets.yaml
          make check-node-config
      - run: make compile
