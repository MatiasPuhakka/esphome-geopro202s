# Loads the component from this checkout and sets every config key it accepts.
# `make check-config` validates it; `esphome compile` builds it.
esphome:
  name: geopro-all-keys

external_components:
  - source:
      type: local
      path: ../components
    components: [geopro_202s]

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  baud_rate: 0

uart:
  tx_pin: GPIO4
  rx_pin: GPIO16
  baud_rate: 4800

geopro_202s:
  id: geopro
  outside_temp:
    name: "outside_temp"
  l1_room:
